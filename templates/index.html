
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>routeX | Monitoring Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>routeX</h1>
        <p>Monitor anything you can reach.</p>
    </header>

    <main>
        <section id="overview">
            <h2>Dashboard</h2>

            <div class="stats">
                <article>
                    <h3>Total Monitors</h3>
                    <p id="total-count">0</p>
                </article>

                <article>
                    <h3>UP</h3>
                    <p id="up-count">0</p>
                </article>

                <article>
                    <h3>DOWN</h3>
                    <p id="down-count">0</p>
                </article>
            </div>
        </section>


        <section id="add-monitor">
            <h2>Add Monitor</h2>

            <form id="monitor-form">
                <label for="monitor-name">Name</label>
                <input
                    type="text"
                    id="monitor-name"
                    name="name"
                    placeholder="e.g. My Website"
                    required
                >

                <label for="monitor-target">Target</label>
                <input
                    type="text"
                    id="monitor-target"
                    name="target"
                    placeholder="e.g. https://example.com or 127.0.0.1"
                    required
                >

                <label for="monitor-type">Monitor Type</label>
                <select id="monitor-type" name="monitor_type">
                    <option value="ping">Ping</option>
                    <option value="http">HTTP</option>
                    <option value="tcp">TCP Port</option>
                </select>

                <div id="monitor-port-section" hidden>
                    <label for="monitor-port">Port</label>
                    <input
                        type="number"
                        id="monitor-port"
                        name="port"
                        min="1"
                        max="65535"
                        placeholder="e.g. 443"
                    >
                </div>

                <button type="submit">Add Monitor</button>
            </form>
        </section>


        <section id="monitors">
            <h2>Monitors</h2>
            <p id="loading-message">Loading monitors...</p>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Target</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="monitor-list"></tbody>
            </table>
        </section>


        <section id="edit-monitor-section" hidden>
            <h2>Edit Monitor</h2>

            <form id="edit-monitor-form">
                <input type="hidden" id="edit-monitor-id">

                <label for="edit-monitor-name">Name</label>
                <input
                    type="text"
                    id="edit-monitor-name"
                    required
                    maxlength="100"
                >

                <label for="edit-monitor-target">Target</label>
                <input
                    type="text"
                    id="edit-monitor-target"
                    required
                    maxlength="500"
                >

                <label for="edit-monitor-type">Monitor Type</label>
                <select id="edit-monitor-type" required>
                    <option value="ping">Ping</option>
                    <option value="http">HTTP</option>
                    <option value="tcp">TCP Port</option>
                </select>

                <div id="edit-monitor-port-section" hidden>
                    <label for="edit-monitor-port">Port</label>
                    <input
                        type="number"
                        id="edit-monitor-port"
                        min="1"
                        max="65535"
                        placeholder="e.g. 443"
                    >
                </div>

                <button type="submit">Save Changes</button>
                <button type="button" id="cancel-edit-button">
                    Cancel
                </button>
            </form>
        </section>


        <section id="history-section" hidden>
            <h2>Check History</h2>
            <p id="history-monitor-name"></p>
            <p id="history-message"></p>

            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Latency</th>
                        <th>Error</th>
                        <th>Checked At</th>
                    </tr>
                </thead>
                <tbody id="history-list"></tbody>
            </table>
        </section>

    </main>
    <script src="/static/app.js"></script>
</body>
</html>
